# Register this layer's recipe directories with BitBake.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "bbb-freq"
BBFILE_PATTERN_bbb-freq = "^${LAYERDIR}/"
BBFILE_PRIORITY_bbb-freq = "6"
LAYERSERIES_COMPAT_bbb-freq = "scarthgap styhead walnascar whinlatter"
